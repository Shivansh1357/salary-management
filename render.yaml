# Render blueprint for the Salary Management API (SQLite on a persistent disk).
# Deploy: New + → Blueprint → point at this repo. Set CORS_ORIGIN to the
# deployed web URL once Vercel is live. See SUBMISSION.md for the full walkthrough.
services:
  - type: web
    name: salary-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # --prod=false so prisma/tsx/tsup (devDeps) are available for build + start.
    # tsup inlines @salary/shared into the bundle, so it needs no separate build.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @salary/api db:generate &&
      pnpm --filter @salary/api build
    # Apply migrations, seed if empty, then start the compiled server.
    startCommand: >-
      pnpm --filter @salary/api exec prisma migrate deploy &&
      pnpm --filter @salary/api exec tsx prisma/seed.ts &&
      node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        sync: false # set to your Vercel web URL, e.g. https://salary-web.vercel.app
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
